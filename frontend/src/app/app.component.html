<div class="search-container">
  <header class="search-header">
    <img
      class="logo"
      src="https://webimages.mongodb.com/_com_assets/cms/kuyj3d95v5vbmm2f4-horizontal_white.svg?auto=format%252Ccompress"
    />
    <h1>Semantic Image Search</h1>
    <p>Search by text description or upload an image</p>
  </header>

  <form [formGroup]="searchForm" (ngSubmit)="onSubmit()">
    <div class="search-methods">
      <button
        type="button"
        [class.active]="searchMethod === 'text'"
        (click)="setSearchMethod('text')"
      >
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        Text Search
      </button>
      <button
        type="button"
        [class.active]="searchMethod === 'image'"
        (click)="setSearchMethod('image')"
      >
        <svg class="icon" viewBox="0 0 24 24">
          <path
            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
          />
        </svg>
        Image Search
      </button>
    </div>

    <div class="search-content">
      <!-- Text Search -->
      <div class="text-search" *ngIf="searchMethod === 'text'">
        <input
          type="text"
          formControlName="textQuery"
          placeholder="Describe what you're looking for..."
        />
        <button
          type="submit"
          [disabled]="loading || !searchForm.get('textQuery')?.value?.trim()"
          class="submit-btn"
        >
          Search
        </button>
      </div>

      <!-- Image Search -->
      <div
        class="image-upload"
        *ngIf="searchMethod === 'image'"
        [class.dragging]="isDragging"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
      >
        <input
          type="file"
          #fileInput
          (change)="onFileSelected($event)"
          accept="image/*"
          class="file-input"
        />

        <div class="upload-content" *ngIf="!selectedFile">
          <svg class="upload-icon" viewBox="0 0 24 24">
            <path
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
            />
          </svg>
          <p>Drag and drop an image here, or</p>
          <button type="button" (click)="fileInput.click()" class="upload-btn">
            Browse Files
          </button>
        </div>

        <div class="preview-content" *ngIf="selectedFile">
          <img [src]="previewUrl" alt="Preview" class="preview-image" />
          <div class="preview-actions">
            <button type="button" (click)="clearFile()" class="clear-btn">
              Clear
            </button>
            <button type="submit" [disabled]="loading" class="submit-btn">
              Search
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>

  <!-- Loading Spinner -->
  <div class="loading-spinner" *ngIf="loading">
    <div class="spinner"></div>
  </div>

  <!-- Results -->
  <div class="results" *ngIf="!loading && products.length > 0">
    <h2>Search Results</h2>
    <div class="products-grid">
      <div class="product-card" *ngFor="let product of products">
        <img [src]="product.image" [alt]="product.name" class="product-image" />
        <div class="product-info">
          <h3>{{ product.name }}</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- No Results -->
  <div
    class="no-results"
    *ngIf="!loading && searchPerformed && products.length === 0"
  >
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <p>No products found matching your search.</p>
  </div>
</div>
